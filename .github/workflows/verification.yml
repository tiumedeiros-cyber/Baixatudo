name: Verificação Baixatudo (não é aprovação de produção)
on:
  workflow_dispatch:
  push:
    branches: [arena/a4f8fa06-baixatudo]
  pull_request:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: verification-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.22.3'
          cache: npm
      - run: npm ci
      - name: Navegador completo para testar extensão real
        run: npx playwright install --with-deps chromium
      - name: Executar testes e a trava de liberação
        shell: bash
        run: |
          export CHROMIUM_EXECUTABLE="$(node --input-type=module -e "import {chromium} from '@playwright/test';console.log(chromium.executablePath())")"
          npm run release:check
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: verification-${{ github.sha }}
          path: |
            test-results/verification.json
            test-results/RELATORIO.md
            test-results/*.log
          retention-days: 7
